name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  check-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install svu
        run: |
          go install github.com/caarlos0/svu/v3@latest

      - name: Check if release needed
        id: check
        run: |
          CURRENT_VERSION=$(${HOME}/go/bin/svu current)
          NEXT_VERSION=$(${HOME}/go/bin/svu next)

          if [ -z "$NEXT_VERSION" ] || [ "$CURRENT_VERSION" = "$NEXT_VERSION" ]; then
            echo "No version bump needed (no conventional commits since last release)"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Current: $CURRENT_VERSION -> Next: $NEXT_VERSION"
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

  auto-release:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Create local tag
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          git tag "$VERSION"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.check-release.outputs.version }}

  tag-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

